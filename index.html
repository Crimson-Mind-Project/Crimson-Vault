<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crimson AI - الذكاء القرمزي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- القائمة الجانبية (اليسار) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">+ محادثة جديدة</button>
            </div>
            <div class="chat-list" id="chatList">
                <div class="chat-item">مرحباً، كيف حالك؟</div>
                <div class="chat-item">أخبرني عن نفسك</div>
                <div class="chat-item">ما هو Crimson AI؟</div>
            </div>
        </div>

        <!-- المنطقة الرئيسية -->
        <div class="main">
            <!-- زر القائمة للهواتف -->
            <button class="menu-toggle" id="menuToggle">☰</button>

            <!-- محتوى الترحيب (يظهر قبل بدء المحادثة) -->
            <div class="welcome" id="welcomeScreen">
                <h1>Crimson AI</h1>
                <p>أنا هنا لخدمتك. ماذا تريد مني أن أفعل لك اليوم؟</p>
            </div>

            <!-- منطقة المحادثة (تظهر بعد بدء الدردشة) -->
            <div class="chat-container hidden" id="chatContainer">
                <div class="messages" id="messages"></div>
            </div>

            <!-- صندوق الكتابة -->
            <div class="input-wrapper">
                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                    <button id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
