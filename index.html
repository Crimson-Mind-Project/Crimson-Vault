<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON VAULT</title>
    <style>
        body { background-color: #000; color: #DC143C; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 2px solid #DC143C; padding: 30px; text-align: center; box-shadow: 0 0 15px #DC143C; width: 80%; max-width: 400px; }
        input { background: #111; border: 1px solid #DC143C; color: #fff; padding: 10px; width: 80%; margin: 15px 0; text-align: center; }
        button { background: #DC143C; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="box">
        <h2>CRIMSON VAULT</h2>
        <p>نظام لؤي الأمني</p>
        <input type="password" id="pin" placeholder="أدخل الرمز">
        <button onclick="check()">دخول</button>
        <p id="msg"></p>
    </div>
    <script>
        function check() {
            if(document.getElementById('pin').value === "123456") {
                document.body.innerHTML = "<h1 style='color:#DC143C; text-align:center;'>مرحباً بك يا سيد لؤي في العقل القرمزي</h1>";
            } else {
                document.getElementById('msg').innerText = "خطأ في الرمز!";
            }
        }
    </script>
</body>
</html>
