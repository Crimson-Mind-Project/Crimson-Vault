<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crimson AI - الذكاء القرمزي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- الشريط العلوي -->
        <div class="header">
            <div class="menu-icon" id="menuIcon">☰</div>
            <div class="logo">CRIMSON AI</div>
            <div class="settings-icon" id="settingsIcon">⚙️</div>
        </div>

        <!-- القائمة الجانبية -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>المحادثات</span>
                <button class="new-chat-btn" id="newChatBtn">+ جديد</button>
            </div>
            <div class="chat-list" id="chatList">
                <!-- المحادثات المحفوظة ستظهر هنا -->
                <div class="chat-item active">محادثة جديدة</div>
            </div>
        </div>

        <!-- منطقة المحادثة الرئيسية -->
        <div class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="message bot-message">
                    <div class="bubble">مرحباً أنا Crimson AI. ماذا تريد مني أن أفعل لك اليوم؟</div>
                </div>
            </div>

            <!-- صندوق الكتابة -->
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
