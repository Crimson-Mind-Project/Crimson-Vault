<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">+ محادثة جديدة</button>
            </div>
            <div class="chat-history">
                <p class="section-title">المحادثات المثبتة</p>
                <div id="pinnedChats">
                    <div class="history-item">📌 خطة Crimson المبدئية</div>
                </div>
                <p class="section-title">الأخيرة</p>
                <div id="recentChats"></div>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <header class="top-nav">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div class="brand">
                    <div class="crimson-logo-small"></div>
                    <span class="brand-name">CRIMSON AI</span>
                </div>
                <div class="user-profile">L</div>
            </header>

            <section class="chat-view">
                <div id="welcomeView" class="welcome-center">
                    <h1 class="welcome-text">مرحباً لؤي،<br><span class="sub-text">من أين نبدأ اليوم؟</span></h1>
                </div>
                <div id="chatMessages" class="messages-container"></div>
            </section>

            <footer class="input-section">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="اسأل Crimson AI..." rows="1" oninput="autoResize(this)"></textarea>
                    <div class="input-tools">
                        <div class="left-tools">
                            <span class="tool-icon" onclick="startVoice()">🎤</span>
                            <span class="tool-icon">➕</span>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
                <p class="disclaimer">نظام كرمسون الذكي - الإصدار التجريبي</p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
