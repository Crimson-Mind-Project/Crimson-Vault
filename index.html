<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <div class="brain-logo"></div>
            <h1 class="main-title">CRIMSON AI</h1>
            <input type="password" id="key" class="crimson-input" placeholder="مفتاح الوصول">
            <button class="entry-btn" onclick="validate()">دخول</button>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <div class="brain-logo small"></div>
            <span class="system-status">CRIMSON SYSTEM ACTIVE</span>
        </header>

        <main class="chat-view">
            <div id="aiMessage"></div>
        </main>

        <footer class="input-container">
            <div class="glow-box">
                <span class="icon" onclick="startVoice()">🎤</span>
                <textarea id="textIn" rows="1" placeholder="أدخل استفساراً..."></textarea>
                <span class="icon" onclick="run()">➔</span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
