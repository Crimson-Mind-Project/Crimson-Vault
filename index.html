<div id="mainApp">
    <header class="app-header">
        <div class="header-left">
            <div class="brain-logo small"></div>
            <span class="app-name">CRIMSON AI</span>
        </div>
        <button class="menu-btn">☰</button>
    </header>

    <main class="chat-viewport">
        <div id="startView" class="gemini-style-start">
            <h1 class="welcome-text">مرحباً..<br>من أين نبدأ؟</h1>
            
            <div class="options-list">
                <div class="option-pill" onclick="selectOption('إنشاء صورة')">
                    <span>🖼️ إنشاء صورة</span>
                </div>
                <div class="option-pill" onclick="selectOption('إنشاء موسيقى')">
                    <span>🎸 إنشاء موسيقى</span>
                </div>
                <div class="option-pill" onclick="selectOption('كتابة أي شيء')">
                    <span>📄 كتابة أي شيء</span>
                </div>
                <div class="option-pill" onclick="selectOption('عزز إنتاجيتك اليوم')">
                    <span>✨ عزز طاقتي وإنتاجيتي اليوم</span>
                </div>
            </div>
        </div>

        <div id="aiMessage" class="chat-bubble" style="display:none;"></div>
    </main>

    <footer class="input-area-fixed">
        <div class="input-wrapper-v3">
            <textarea id="textIn" placeholder="اسأل Crimson AI" rows="1" oninput="autoResize(this)"></textarea>
            <div class="action-bar">
                <div class="left-tools">
                    <span class="tool-icon" onclick="startVoice()">🎤</span>
                    <span class="tool-icon">➕</span>
                </div>
                <button class="send-btn-final" onclick="run()">➔</button>
            </div>
        </div>
    </footer>
</div>
