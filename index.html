<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIMSON VAULT | النواة القرمزية</title>
    <style>
        /* تصميم الخلفية والجو العام */
        body { 
            background-color: #000; 
            color: #DC143C; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            background: radial-gradient(circle, #1a0000 0%, #000 100%);
        }

        /* صندوق الحماية الرئيسي */
        .vault-box { 
            border: 2px solid #DC143C; 
            padding: 50px; 
            border-radius: 5px; 
            box-shadow: 0 0 20px #DC143C, inset 0 0 10px #DC143C; 
            text-align: center; 
            background: rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* تأثير الخطوط الرقمية في الخلفية */
        .vault-box::before {
            content: "SYSTEM SECURED";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            padding: 0 10px;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        h1 { 
            font-size: 2rem; 
            letter-spacing: 5px; 
            margin-bottom: 30px; 
            text-shadow: 2px 2px 5px #000;
        }

        /* خانة إدخال الرمز */
        input { 
            background: #1a0000; 
            border: 1px solid #DC143C; 
            color: #fff; 
            padding: 15px; 
            text-align: center; 
            font-size: 1.5rem; 
            width: 200px; 
            outline: none; 
            margin-bottom: 25px; 
            letter-spacing: 10px;
        }

        /* زر الدخول */
        button { 
            background: transparent; 
            color: #DC143C; 
            border: 1px solid #DC143C; 
            padding: 10px 40px; 
            font-size: 1rem;
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: #DC143C;
            color: #000;
            box-shadow: 0 0 15px #DC143C;
        }

        #message { 
            margin-top: 20px; 
            font-size: 0.9rem; 
            min-height: 20px;
        }

        /* تأثير الوميض */
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div class="vault-box" id="mainContainer">
        <h1 class="blink">CRIMSON VAULT</h1>
        <p style="color: #ccc; font-size: 0.8rem; margin-bottom: 20px;">بروتوكول الوصول: لؤي</p>
        
        <input type="password" id="pinInput" maxlength="6" placeholder="******">
        <br>
        <button onclick="accessVault()">تفعيل النواة</button>
        
        <div id="message"></div>
    </div>

    <script>
        function accessVault() {
            const pin = document.getElementById('pinInput').value;
            const msg = document.getElementById('message');
            const container = document.getElementById('mainContainer');

            // رمز الدخول الخاص بك
            if (pin === "123456") {
                msg.style.color = "#00ff00";
                msg.innerText = "جاري مطابقة الهوية... تم القبول.";
                
                setTimeout(() => {
                    container.innerHTML = `
                        <h1 style="color: #00ff00;">تم الدخول</h1>
                        <p style="color: #fff;">مرحباً بك يا سيد لؤي.</p>
                        <hr style="border: 1px solid #00ff00;">
                        <p style="font-size: 0.8rem; color: #888;">النظام الآن في وضع الاستعداد التام.</p>
                        <button onclick="location.reload()" style="border-color: #888; color: #888;">خروج</button>
                    `;
                }, 2000);
            } else {
                msg.style.color = "#ff0000";
                msg.innerText = "خطأ في الرمز! تم تسجيل محاولة اختراق.";
                document.getElementById('pinInput').value = "";
            }
        }
    </script>
</body>
</html>
